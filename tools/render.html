<!doctype html>
<!-- Headless check page. Usage:
     render.html?figs=daruma,gama          construction | finished, one row per figure
     render.html?scene=42                  an invented scene
     render.html?figs=gama&page=1          adds the source book page on the right
     Screenshot: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless
       --screenshot=out.png --window-size=1400,900 "file://$PWD/tools/render.html?figs=gama" -->
<html><head><meta charset="utf-8">
<style>body{margin:0;background:#2a2622;font:12px sans-serif;color:#eee}.row{display:flex;gap:8px;padding:6px;align-items:flex-start}img{height:340px}canvas{background:#efe6d2}#err{color:#f88;white-space:pre;padding:8px}</style>
<script src="../lib/hokusai.js"></script>
<script src="../figures/all.js"></script>
</head><body><div id="err"></div><div id="out"></div>
<script>
window.onerror = (m, s, l) => { document.getElementById('err').textContent += m + ' @' + s + ':' + l + '\n'; };
const q = new URLSearchParams(location.search), out = document.getElementById('out');
const S = +(q.get('scale') || 3.4);
function panel(c, opts) {
  const cv = document.createElement('canvas');
  cv.width = c.size[0] * S; cv.height = c.size[1] * S;
  const g = cv.getContext('2d');
  Hokusai.paper(g, cv.width, cv.height, 3);
  Hokusai.render(g, c, Object.assign({ scale: S }, opts));
  return cv;
}
try {
  if (q.get('scene')) {
    const sc = Hokusai.inventScene(+q.get('scene'));
    const row = document.createElement('div'); row.className = 'row';
    row.appendChild(panel(sc, { guides: 'none' })); out.appendChild(row);
  }
  if (q.get('gallery')) {
    const row = document.createElement('div'); row.className = 'row'; row.style.flexWrap = 'wrap';
    for (const f of Hokusai.list()) {
      const c = Hokusai.compile(f), s = 150 / Math.max(c.size[0], c.size[1]);
      const cv = document.createElement('canvas'); cv.width = c.size[0] * s; cv.height = c.size[1] * s;
      const gg = cv.getContext('2d'); Hokusai.paper(gg, cv.width, cv.height, 3); Hokusai.render(gg, c, { scale: s, guides: 'none' });
      const box = document.createElement('div'); box.style.width = '156px'; box.appendChild(cv);
      box.appendChild(Object.assign(document.createElement('div'), { textContent: f.id + ' p' + f.page }));
      row.appendChild(box);
    }
    out.appendChild(row);
  }
  for (const id of (q.get('figs') || '').split(',').filter(Boolean)) {
    const f = Hokusai.figures[id];
    const row = document.createElement('div'); row.className = 'row';
    if (!f) { row.textContent = 'missing figure ' + id; out.appendChild(row); continue; }
    const c = Hokusai.compile(f);
    row.appendChild(panel(c, { guides: 'shu' }));
    row.appendChild(panel(c, { guides: 'none' }));
    if (q.get('page') && f.page) { const im = new Image(); im.src = '../assets/pages/page-' + String(f.page).padStart(2, '0') + '.jpg'; row.appendChild(im); }
    const lab = document.createElement('div'); lab.textContent = id + ' (p.' + f.page + ')'; row.appendChild(lab);
    out.appendChild(row);
  }
} catch (e) { document.getElementById('err').textContent += e.stack; }
</script></body></html>
