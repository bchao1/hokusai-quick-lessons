<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hayaoshie Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #e4e5e9;
  --surface: #f3f3f5;
  --raised: #fbfbfc;
  --ink: #1b2130;
  --muted: #5b6273;
  --line: #c8cbd5;
  --ai: #2d4a7e;          /* indigo of the book's cover */
  --ai-soft: #d7deec;
  --shu: #c43b27;         /* vermilion: compass & ruler guides */
  --washi: #efe6d2;
  --display: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
  --body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #10141e; --surface: #171c29; --raised: #1e2433; --ink: #e7e4dc; --muted: #9ba1b1;
    --line: #2b3346; --ai: #93acdb; --ai-soft: #25304a; --shu: #e3644d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #10141e; --surface: #171c29; --raised: #1e2433; --ink: #e7e4dc; --muted: #9ba1b1;
  --line: #2b3346; --ai: #93acdb; --ai-soft: #25304a; --shu: #e3644d; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.55 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

header {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding-block: 12px; padding-inline: 20px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { margin: 0; font: 700 22px/1 var(--display); letter-spacing: 0.04em; }
.brand span { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav button {
  border: 1px solid transparent; background: none; padding: 6px 14px; border-radius: 3px; cursor: pointer;
  display: flex; gap: 8px; align-items: baseline; color: var(--muted);
}
nav button b { font: 700 16px var(--display); color: var(--ink); }
nav button[aria-selected="true"] { border-color: var(--line); background: var(--raised); color: var(--ink); }

main { display: grid; grid-template-columns: 250px minmax(0, 1fr) 330px; height: calc(100% - 60px); }
main.wide { grid-template-columns: 250px minmax(0, 1fr) minmax(360px, 40%); }
aside, .panel { overflow-y: auto; background: var(--surface); }
aside { border-right: 1px solid var(--line); }
.panel { border-left: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }

/* catalogue */
.vol { padding: 14px 16px 6px; display: flex; align-items: baseline; gap: 8px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.vol h2 { margin: 0; font: 700 15px var(--display); }
.vol small { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.figlist { list-style: none; margin: 0; padding: 0 8px 12px; }
.figlist button {
  width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 3px; cursor: pointer;
  display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: baseline;
}
.figlist button:hover { background: var(--raised); }
.figlist button[aria-current="true"] { background: var(--ai-soft); }
.figlist .jp { font: 500 15px var(--display); }
.figlist .en { grid-column: 1; font-size: 12px; color: var(--muted); }
.figlist .pg { grid-row: 1; grid-column: 2; font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* stage */
.stage { display: flex; flex-direction: column; min-width: 0; }
.canvas-wrap { flex: 1; display: grid; place-items: center; padding: 20px; min-height: 320px; position: relative; }
#stage { max-width: 100%; max-height: 100%; box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 8px 30px rgba(20,25,40,.18); background: var(--washi); }
.transport {
  display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-inline: 20px;
  border-top: 1px solid var(--line); background: var(--surface); flex-wrap: wrap;
}
.transport button.play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); cursor: pointer; display: grid; place-items: center; }
.transport input[type=range] { flex: 1; min-width: 120px; accent-color: var(--ai); }
.phases { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.phases span { display: flex; gap: 5px; align-items: baseline; }
.phases span b { font: 700 13px var(--display); }
.phases span.on { color: var(--ink); }
.phases span.on b { color: var(--shu); }

/* panel */
.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.lesson h2 { margin: 0; font: 700 30px/1.15 var(--display); text-wrap: balance; }
.lesson .en { font-size: 15px; color: var(--muted); margin-top: 4px; }
.lesson p { margin: 12px 0 0; max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 3px 10px; cursor: pointer;
  display: inline-flex; gap: 6px; align-items: baseline; font-size: 12px;
}
.chip b { font: 700 13px var(--display); }
.chip:hover { border-color: var(--ai); }
.rule-detail { font-size: 13px; color: var(--muted); border-left: 2px solid var(--shu); padding-left: 10px; }
.source img { width: 100%; border-radius: 2px; cursor: zoom-in; display: block; }
.source figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.controls { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 10px; align-items: center; font-size: 13px; }
.controls label { color: var(--muted); }
.controls input[type=range] { accent-color: var(--ai); width: 100%; }
.controls output { font: 12px var(--mono); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; grid-column: 2 / 4; }
.seg button { flex: 1; border: 0; background: var(--raised); padding: 5px 6px; cursor: pointer; font-size: 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ai); color: var(--raised); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--raised); padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 13px; }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--raised); }
.btn:hover { border-color: var(--ai); }
select, input[type=number] { background: var(--raised); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; width: 100%; }

/* editor */
textarea#code {
  width: 100%; min-height: 420px; resize: vertical; background: var(--raised); border: 1px solid var(--line); border-radius: 3px;
  font: 12px/1.5 var(--mono); padding: 10px; tab-size: 2; white-space: pre; overflow: auto;
}
.err { font: 12px var(--mono); color: var(--shu); white-space: pre-wrap; }
.hint { font-size: 12px; color: var(--muted); }
.hint code, .rulebook code { font: 12px var(--mono); background: var(--raised); padding: 0 4px; border-radius: 2px; }

/* compose caption, write steps */
.cap { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; margin: 0; font-size: 13px; }
.cap dt { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding-top: 2px; }
.cap dd { margin: 0; display: flex; flex-direction: column; gap: 2px; }
.cap dd span { color: var(--muted); font-size: 12px; }
.linkish { all: unset; cursor: pointer; font-weight: 700; color: var(--ai); text-decoration: underline; text-underline-offset: 2px; }
.linkish:focus-visible { outline: 2px solid var(--ai); }
.steps { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
.steps code { font: 12px var(--mono); background: var(--raised); padding: 0 4px; border-radius: 2px; }

details.code summary { cursor: pointer; font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
details.code textarea { margin-top: 8px; }
.steps3 { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; margin: 0; }
.steps3 b { font: 700 14px var(--display); color: var(--shu); }
.laws { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 14px; }
.law { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; font-size: 13px; }
.law b { display: block; font: 700 22px var(--display); color: var(--ink); }

/* rulebook */
.rulebook { grid-column: 2 / 4; overflow-y: auto; padding-block: 24px; padding-inline: 28px; }
.rulebook .intro { max-width: 68ch; }
.rulebook .intro h2 { font: 700 28px var(--display); margin: 0 0 8px; }
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 20px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.rule header { all: unset; display: flex; align-items: baseline; gap: 10px; }
.rule header b { font: 700 24px var(--display); color: var(--shu); }
.rule header span { font-weight: 700; }
.rule p { margin: 0; }
.rule .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rule .meta a { color: var(--ai); cursor: pointer; }

dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 94vh; }
dialog::backdrop { background: rgba(10, 12, 20, .8); }
dialog img { max-width: 96vw; max-height: 90vh; display: block; }
dialog p { color: #eee; margin: 8px 0 0; font-size: 13px; }

@media (max-width: 1000px) {
  main { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 240px; border-right: 0; border-bottom: 1px solid var(--line); }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .canvas-wrap { min-height: 60vw; padding: 16px; }
  .rulebook { grid-column: 1; padding-inline: 16px; }
  nav { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script src="lib/hokusai.js"></script>
<script src="figures/all.js"></script>
</head>
<body>
<header>
  <div class="brand"><h1>略画早指南</h1><span>Hokusai's quick lessons, as code</span></div>
  <nav role="tablist">
    <button role="tab" data-mode="figure" aria-selected="true"><b>図</b>Figure</button>
    <button role="tab" data-mode="scene" aria-selected="false"><b>構図</b>Scene</button>
    <button role="tab" data-mode="rules" aria-selected="false"><b>規矩</b>Rulebook</button>
  </nav>
</header>

<main id="main">
  <aside id="catalogue" aria-label="Figures"></aside>

  <section class="stage" id="stageCol">
    <div class="canvas-wrap" id="wrap"><canvas id="stage" aria-label="Drawing"></canvas></div>
    <div class="transport">
      <button class="btn primary" id="play" aria-label="Animate the drawing">▶ Animate</button>
      <input type="range" id="scrub" min="0" max="1000" value="1000" aria-label="Drawing progress">
      <div class="phases">
        <span id="ph1"><b>規矩</b>construct</span>
        <span id="ph2"><b>墨</b>ink</span>
        <span id="ph3"><b>消</b>erase</span>
      </div>
    </div>
  </section>

  <section class="panel" id="panel"></section>
  <section class="rulebook" id="rulebook" hidden></section>
</main>

<dialog id="lightbox"><img id="lbImg" alt=""><p id="lbCap"></p></dialog>

<script>
(function () {
'use strict';
const H = window.Hokusai;
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ruleById = Object.fromEntries(H.RULES.map((r) => [r.id, r]));
const pageSrc = (p) => 'assets/pages/page-' + String(p).padStart(2, '0') + '.jpg';
const store = {
  get(k, d) { try { const v = localStorage.getItem('hokusai:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hokusai:' + k, JSON.stringify(v)); } catch (e) {} },
};
const CATS = [['contour', 'outline', '#8f98ab'], ['hair', 'hair', '#2e6fd8'], ['tick', 'ticks', '#1d8f4e'], ['dot', 'dots', '#1aa3b8'], ['whorl', 'curls', '#a13ca8'], ['compass', 'arcs', '#d2372a'], ['ruled', 'ruled', '#e07b00'], ['fill', 'solid black', '#5b5bc8']];

// query parameters (for links and testing): ?fig=shishi&draw=rules&vary=0.8&hand=2&seed=5&weight=1.5&style=sumi
const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? +Q.get(k) : d);
const state = {
  mode: ['figure', 'scene', 'rules'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'figure',
  fig: Q.get('fig') || store.get('fig', null) || H.order[0],
  draw: Q.get('draw') || store.get('draw', 'hokusai'),        // 'hokusai' (traced strokes) | 'rules' (old hand-written)
  vary: num('vary', 0),
  seed: num('seed', 1812), hand: num('hand', store.get('hand', 1)), weight: num('weight', 1),
  style: Q.get('style') || store.get('style', 'hanga'),
  cats: {},                                                   // hidden stroke categories
  construction: true, erase: true,
  p: 1.15, playing: false,
  scene: Object.assign({ seed: 42, subject: '', paint: 'hokusai', vary: 0 }, store.get('scene', {})),
  code: null, codeErr: '',
};
if (!H.figures[state.fig]) state.fig = H.order[0];
const hasTrace = (id) => !!(H.figures[id] && H.figures[id].traced && H.figures[id].traced.fin && H.strokeDB[H.figures[id].traced.fin]);
const drawMode = () => (state.draw === 'hokusai' && hasTrace(state.fig) ? 'hokusai' : 'rules');

// ───────────── what is on the stage ─────────────
function look() { return { seed: state.seed, weight: state.weight, wobble: 1, style: state.style, hand: state.hand }; }
function shownCats() { return CATS.map((c) => c[0]).filter((c) => !state.cats[c]); }
function figurePicture() {
  const id = state.fig;
  if (drawMode() === 'hokusai') {
    const cats = shownCats();
    // his strokes; with a construction they are carried by it (vary 0 = his drawing exactly)
    const gf = H.constructions && H.constructions[id] && H.generatedFigure ? H.generatedFigure(id, { seed: state.seed, vary: state.vary, cats }) : null;
    const tf = gf || H.tracedFigure(id);
    if (!gf) tf.ink = [['utsushi', tf.ink[0][1], { cats }]];
    return H.compile(tf, look());
  }
  if (state.code) {
    const fig = new Function('Hokusai', '"use strict"; return (' + state.code + ')')(H);
    if (!fig || typeof fig !== 'object') throw new Error('The editor must contain one figure object { ... }');
    fig.id = fig.id || 'untitled';
    return H.compile(fig, look());
  }
  return H.compile(id, look());
}
function scenePicture() {
  const c = state.scene;
  return H.inventScene(c.seed, { subject: H.figures[c.subject] ? c.subject : undefined, style: state.style, hand: state.hand, paint: c.paint === 'rules' ? 'rules' : 'hokusai', vary: c.vary || 0 });
}

// A varied or re-inked figure can spill past its original box. Frame the drawing by what is
// actually drawn (ink and construction), with a margin of a quarter of its size on every side.
const MARGIN = 0.25;
function fitToCanvas(c) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (p, r) => { r = r || 0; if (p[0] - r < x0) x0 = p[0] - r; if (p[1] - r < y0) y0 = p[1] - r; if (p[0] + r > x1) x1 = p[0] + r; if (p[1] + r > y1) y1 = p[1] + r; };
  c.ops.forEach((op) => {
    if (op.pts) op.pts.forEach((p, i) => add(p, op.widths ? op.widths[i] / 2 : 0));
    if (op.polys) op.polys.forEach((pl) => pl.forEach((p) => add(p)));
    if (op.dots) op.dots.forEach((d) => add(d, d[2]));
  });
  if (!isFinite(x0)) return c;
  const w = x1 - x0, h = y1 - y0, m = MARGIN * Math.max(w, h);
  const ops = H.place({ size: c.size, ops: c.ops }, { x: m - x0, y: m - y0, s: 1 });
  return Object.assign({}, c, { ops, size: [w + 2 * m, h + 2 * m] });
}

// ───────────── stage ─────────────
const cv = $('#stage'), g = cv.getContext('2d'), wrap = $('#wrap');
let compiled = null, paperCache = null, lastErr = '';
function recompile() {
  lastErr = '';
  try { compiled = state.mode === 'scene' ? scenePicture() : fitToCanvas(figurePicture()); } catch (e) { compiled = null; lastErr = e.message; }
  const err = $('#codeErr'); if (err) err.textContent = lastErr;
  resize();
}
function resize() {
  if (!compiled) { g.clearRect(0, 0, cv.width, cv.height); return; }
  const [w, h] = compiled.size, r = wrap.getBoundingClientRect();
  const s = Math.max(1, Math.min((r.width - 40) / w, (r.height - 40) / h)), dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.round(w * s) + 'px'; cv.style.height = Math.round(h * s) + 'px';
  cv.width = Math.round(w * s * dpr); cv.height = Math.round(h * s * dpr); cv._scale = s * dpr;
  paperCache = document.createElement('canvas'); paperCache.width = cv.width; paperCache.height = cv.height;
  H.paper(paperCache.getContext('2d'), cv.width, cv.height, 11, state.style);
  draw();
}
function draw() {
  if (!compiled) return;
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(paperCache, 0, 0);
  const guides = state.construction ? 'shu' : 'none';
  const ops = guides === 'none' ? compiled.ops.filter((o) => o.layer !== 'guide') : compiled.ops;
  const t = Math.min(1, state.p), fade = state.erase ? Math.max(0, Math.min(1, (state.p - 1) / 0.15)) : 0;
  H.render(g, ops, { scale: cv._scale, t, guides, guideFade: fade, style: state.style });
  const seq = H.sequence(ops), tl = H.timeline(seq);
  const guideEnd = seq.reduce((m, o, i) => (o.layer === 'guide' ? tl.marks[i][1] : m), 0) / (tl.total || 1);
  $('#ph1').classList.toggle('on', guides !== 'none' && t < guideEnd);
  $('#ph2').classList.toggle('on', t >= guideEnd && state.p <= 1);
  $('#ph3').classList.toggle('on', state.p > 1 && state.erase && guides !== 'none');
  $('#scrub').value = Math.round((state.p / 1.15) * 1000);
}
let raf = 0, last = 0;
function tick(ts) {
  if (!state.playing) return;
  const dt = last ? (ts - last) / 1000 : 0; last = ts;
  const total = compiled ? H.timeline(compiled.ops).total : 1, secs = Math.max(4, Math.min(12, total / 90));
  state.p = Math.min(1.15, state.p + (dt / secs) * (state.p > 1 ? 0.6 : 1));
  draw();
  if (state.p >= 1.15) return setPlaying(false);
  raf = requestAnimationFrame(tick);
}
function setPlaying(on) {
  state.playing = on; $('#play').textContent = on ? '❚❚ Pause' : '▶ Animate'; $('#play').setAttribute('aria-label', on ? 'Pause' : 'Animate the drawing');
  if (on) { if (state.p >= 1.15) state.p = 0; last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
}
const replay = () => { state.p = 0; setPlaying(true); };          // only from the Animate button
const show = () => { setPlaying(false); state.p = 1.15; draw(); };  // everything else lands on the finished drawing
// a change of look shows the finished drawing at once; replay animates it
const redrawNow = () => { setPlaying(false); state.p = 1.15; recompile(); };
$('#play').onclick = () => { if (state.playing) setPlaying(false); else if (state.p >= 1.15 || state.p <= 0) replay(); else setPlaying(true); };
$('#scrub').oninput = (e) => { setPlaying(false); state.p = (e.target.value / 1000) * 1.15; draw(); };
new ResizeObserver(() => resize()).observe(wrap);

// ───────────── catalogue (always the figure the other views use) ─────────────
function renderCatalogue() {
  const vols = [[1, '初編', 'Compass & ruler · 1812'], [2, '後編', 'Characters · 1814']];
  $('#catalogue').innerHTML = vols.map(([v, jp, en]) => {
    const figs = H.list((f) => (f.vol || 1) === v && !/-trace$/.test(f.id)).sort((a, b) => (a.page || 0) - (b.page || 0));
    return !figs.length ? '' : '<div class="vol"><h2>' + jp + '</h2><small>' + en + '</small></div><ul class="figlist">' +
      figs.map((f) => '<li><button data-fig="' + esc(f.id) + '" aria-current="' + (f.id === state.fig) + '">' +
        '<span class="jp">' + esc(f.jp || f.title) + '</span><span class="pg">p.' + esc(f.page || '–') + '</span><span class="en">' + esc(f.title) + '</span></button></li>').join('') + '</ul>';
  }).join('');
}
$('#catalogue').onclick = (e) => {
  const b = e.target.closest('[data-fig]'); if (!b) return;
  state.fig = b.dataset.fig; store.set('fig', state.fig); state.code = null; state.vary = 0;
  if (state.mode === 'scene') state.scene.subject = state.fig;
  if (state.mode === 'rules') return setMode('figure');
  renderCatalogue(); renderPanel(); recompile(); show();
};

// ───────────── shared brush controls ─────────────
function brushHTML() {
  return '<div><p class="eyebrow">Brush</p><div class="controls">' +
    '<label>Style</label><div class="seg" id="cStyle">' + [['hanga', '版画 Print'], ['sumi', '墨 Brush'], ['zu', '図 Diagram']].map(([k, l]) => '<button data-s="' + k + '" aria-pressed="' + (state.style === k) + '">' + l + '</button>').join('') + '</div>' +
    '<label for="cHand">Hand</label><input type="range" id="cHand" min="0" max="3" step="0.05" value="' + state.hand + '"' + (state.style === 'zu' ? ' disabled' : '') + '><output>' + state.hand.toFixed(2) + '</output>' +
    '<label for="cWeight">Weight</label><input type="range" id="cWeight" min="0.3" max="2.5" step="0.05" value="' + state.weight + '"><output>' + state.weight.toFixed(2) + '</output>' +
    '<label for="cSeed">Seed</label><input type="number" id="cSeed" value="' + state.seed + '" style="width:100%"><button class="btn" id="cSeedNew" title="New seed">↻</button>' +
    '</div><div class="hint" style="margin-top:6px"><b>Hand</b> 0 inks the strokes exactly; higher re-inks every stroke with drift, tremor and pressure. <b>Seed</b> picks one of those re-inkings. <b>Weight</b> thickens or thins the line.' + (state.style === 'zu' ? ' Diagram style ignores Hand.' : '') + '</div></div>' +
    '<div class="row"><button class="btn" id="exPNG">Save PNG</button><button class="btn" id="exSVG">Save SVG</button></div>';
}
function bindBrush() {
  const range = (id, key, fix) => { const el = $('#' + id); if (!el) return; el.oninput = () => { state[key] = +el.value; el.nextElementSibling.textContent = (+el.value).toFixed(fix); redrawNow(); }; };
  range('cHand', 'hand', 2); range('cWeight', 'weight', 2);
  const hEl = $('#cHand'); if (hEl) hEl.onchange = () => store.set('hand', state.hand);
  $('#cSeed').onchange = (e) => { state.seed = +e.target.value || 1; redrawNow(); };
  $('#cSeedNew').onclick = () => { state.seed = 1 + Math.floor(Math.random() * 9999); $('#cSeed').value = state.seed; redrawNow(); };
  $('#cStyle').onclick = (e) => { const b = e.target.closest('[data-s]'); if (!b) return; state.style = b.dataset.s; store.set('style', state.style); renderPanel(); redrawNow(); };
  $('#exPNG').onclick = exportPNG; $('#exSVG').onclick = exportSVG;
}

// ───────────── panels ─────────────
function renderPanel() {
  const P = $('#panel');
  if (state.mode === 'scene') return renderScenePanel(P);
  const f = H.figures[state.fig];
  if (!f) { P.innerHTML = '<p>No figures loaded.</p>'; return; }
  const dm = drawMode(), traced = hasTrace(f.id), cons = H.constructions && H.constructions[f.id];
  const db = traced ? H.strokeDB[f.traced.fin] : null;
  const rules = (f.rules || []).filter((r) => ruleById[r]);
  P.innerHTML =
    '<div class="lesson"><p class="eyebrow">Volume ' + (f.vol || 1) + ' · page ' + esc(f.page) + '</p><h2>' + esc(f.jp || f.title) + '</h2><div class="en">' + esc(f.title) + '</div>' +
    (f.note ? '<p>' + esc(f.note) + '</p>' : '') + '</div>' +
    '<div><p class="eyebrow">How it is drawn</p><dl class="steps3">' +
      '<b>規矩</b><span>' + (dm === 'hokusai' ? (cons ? 'His construction, traced from the diagram on the same spread and laid onto the drawing (red).' : 'No construction diagram for this figure.') : 'Guides written by hand in <code>figures/</code>.') + '</span>' +
      '<b>墨</b><span>' + (dm === 'hokusai' ? 'His strokes, traced from the scan by code: ' + db.strokes.length + ' strokes, ' + db.fills.length + ' solid blacks.' : (f.ink || []).length + ' ink operations written by hand.') + '</span>' +
      '<b>消</b><span>The construction is erased when the ink is done.</span></dl></div>' +
    '<div><p class="eyebrow">Drawing</p><div class="seg" id="cDraw">' +
      [['hokusai', '写 Hokusai\'s strokes'], ['rules', '規 Old hand-written version']].map(([k, l]) => '<button data-d="' + k + '" aria-pressed="' + (dm === k) + '"' + (k === 'hokusai' && !traced ? ' disabled' : '') + '>' + l + '</button>').join('') + '</div></div>' +
    (dm === 'hokusai' && cons ? '<div><p class="eyebrow">New subject</p><div class="controls"><label for="cVary">Vary</label><input type="range" id="cVary" min="0" max="1.5" step="0.05" value="' + state.vary + '"><output>' + state.vary.toFixed(2) + '</output></div>' +
      '<div class="hint" style="margin-top:6px">0 is his drawing. Above 0 his construction is reshaped (proportions and a smooth warp, chosen by the seed) and his strokes move with it: a new subject in his line.</div></div>' : '') +
    (dm === 'hokusai' ? '<div><p class="eyebrow">Layers</p><div class="chips" id="cCats">' + CATS.filter(([c]) => db.counts[c]).map(([c, name, col]) =>
      '<button class="chip" data-c="' + c + '" aria-pressed="' + !state.cats[c] + '" style="' + (state.cats[c] ? 'opacity:.4' : '') + '"><b style="color:' + col + '">●</b>' + name + ' ' + db.counts[c] + '</button>').join('') + '</div></div>' : '') +
    '<div class="controls"><label for="cCons">Animation</label><span style="grid-column:2/4"><input type="checkbox" id="cCons"' + (state.construction ? ' checked' : '') + '> start with the construction (red), erase it at the end</span></div>' +
    brushHTML() +
    (dm === 'rules' ? '<details class="code"' + (state.code ? ' open' : '') + '><summary>Edit this version as code</summary><textarea id="code" spellcheck="false" aria-label="Figure source">' + esc(state.code || fmt(f)) + '</textarea><div class="err" id="codeErr">' + esc(lastErr) + '</div><div class="row"><button class="btn" id="codeReset">Reset</button></div></details>' : '') +
    (rules.length ? '<div><p class="eyebrow">Rules this lesson teaches</p><div class="chips">' + rules.map((r) => '<span class="chip" title="' + esc(ruleById[r].text) + '"><b>' + ruleById[r].jp + '</b>' + esc(ruleById[r].name) + '</span>').join('') + '</div></div>' : '') +
    (f.page ? '<figure class="source" style="margin:0"><p class="eyebrow">Source spread</p><img id="srcImg" src="' + pageSrc(f.page) + '" alt="Book spread, PDF page ' + f.page + '"><figcaption>Ryakuga hayaoshie, PDF page ' + f.page + '. Arthur Tress Collection, University of Pennsylvania. No copyright (US).</figcaption></figure>' : '');
  $('#cDraw').onclick = (e) => { const b = e.target.closest('[data-d]'); if (!b || b.disabled) return; state.draw = b.dataset.d; store.set('draw', state.draw); renderPanel(); recompile(); show(); };
  const vy = $('#cVary'); if (vy) vy.oninput = () => { state.vary = +vy.value; vy.nextElementSibling.textContent = state.vary.toFixed(2); redrawNow(); };
  const cc = $('#cCats'); if (cc) cc.onclick = (e) => { const b = e.target.closest('[data-c]'); if (!b) return; state.cats[b.dataset.c] = !state.cats[b.dataset.c]; renderPanel(); redrawNow(); };
  $('#cCons').onchange = (e) => { state.construction = e.target.checked; show(); };
  const code = $('#code');
  if (code) {
    let tmr = 0;
    code.oninput = () => { clearTimeout(tmr); tmr = setTimeout(() => { state.code = code.value; redrawNow(); }, 250); };
    $('#codeReset').onclick = () => { state.code = null; renderPanel(); recompile(); show(); };
  }
  const si = $('#srcImg'); if (si) si.onclick = () => lightbox(f.page);
  bindBrush();
}

function renderScenePanel(P) {
  const c = state.scene, figs = H.list((f) => !f.noScene && f.place !== 'sky' && !/-trace$/.test(f.id));
  const cap = (compiled && compiled.caption) || [];
  P.innerHTML =
    '<div class="lesson"><p class="eyebrow">Scene</p><h2>構図</h2><div class="en">A picture made of his figures</div>' +
    '<p>The engine picks a subject, puts it in the setting the book draws it in (sea creatures over waves, travellers in rain, a crane at the water), and adds a companion and weather that belong there.</p></div>' +
    '<div class="row"><button class="btn primary" id="roll">New picture</button></div>' +
    '<div class="controls">' +
    '<label for="kSub">Subject</label><select id="kSub" style="grid-column:2/4"><option value="">chosen by the picture</option>' + figs.map((f) => '<option value="' + esc(f.id) + '"' + (c.subject === f.id ? ' selected' : '') + '>' + esc((f.jp ? f.jp + '  ' : '') + f.title) + '</option>').join('') + '</select>' +
    '<label>Figures</label><div class="seg" id="kPaint">' + [['hokusai', '写 Hokusai\'s strokes'], ['rules', '規 Old version']].map(([k, l]) => '<button data-v="' + k + '" aria-pressed="' + ((c.paint || 'hokusai') === k) + '">' + l + '</button>').join('') + '</div>' +
    '<label for="kVary">Vary</label><input type="range" id="kVary" min="0" max="1.5" step="0.05" value="' + (c.vary || 0) + '"><output>' + (+(c.vary || 0)).toFixed(2) + '</output>' +
    '</div>' +
    (cap.length ? '<div><p class="eyebrow">What is in this picture</p><dl class="cap">' + cap.map((r) =>
      '<dt>' + esc(r.k) + '</dt><dd>' + (r.fig ? '<button class="linkish" data-fig="' + esc(r.fig) + '">' + esc(r.v) + '</button>' : '<b>' + esc(r.v) + '</b>') + '<span>' + esc(r.why) + '</span></dd>').join('') + '</dl></div>' : '') +
    brushHTML();
  const save = () => { store.set('scene', c); recompile(); renderPanel(); show(); };
  $('#roll').onclick = () => { c.seed = Math.floor(Math.random() * 99999); save(); };
  $('#kSub').onchange = (e) => { c.subject = e.target.value; save(); };
  $('#kPaint').onclick = (e) => { const b = e.target.closest('[data-v]'); if (!b) return; c.paint = b.dataset.v; save(); };
  $('#kVary').onchange = (e) => { c.vary = +e.target.value; save(); };
  P.querySelectorAll('.cap [data-fig]').forEach((b) => (b.onclick = () => { state.fig = b.dataset.fig; store.set('fig', state.fig); setMode('figure'); }));
  bindBrush();
}

// ───────────── rulebook: the rules and the measured laws ─────────────
function renderRulebook() {
  const figsFor = (id) => H.list((f) => (f.rules || []).includes(id) && !/-trace$/.test(f.id));
  const st = H.strokeStats, fin = st && st.by && (st.by.finished || st.by.all), j = st && st.joins && st.joins.finished;
  const q = (c, k) => (fin && fin[c] && fin[c][k] ? fin[c][k].p50 : null);
  const law = (big, text) => '<div class="law"><b>' + big + '</b>' + text + '</div>';
  $('#rulebook').innerHTML =
    '<div class="intro"><p class="eyebrow">The rulebook</p><h2>規矩 — the compass and the ruler</h2>' +
    '<p>In 1812 Hokusai published a drawing manual built on one claim: anything can be drawn with the compass and the ruler. Volume one lays each subject out as circles, squares and triangles, then inks only what the subject needs. Volume two, from 1814, builds figures from the brush strokes of written characters.</p></div>' +
    (fin ? '<div class="intro" style="margin-top:22px"><p class="eyebrow">Measured from his strokes</p><h2>筆跡 — the laws of the hand</h2><p>Traced out of the scans by code (' + st.regions + ' regions). Lengths are in line widths. Full report: <code>data/analysis/report.md</code>.</p></div><div class="laws">' +
      law(q('contour', 'len_w') ? q('contour', 'len_w').toFixed(0) : '–', 'line widths: a typical outline stroke. Hair is ' + (q('hair', 'len_w') || 0).toFixed(0) + ', a tick ' + (q('tick', 'len_w') || 0).toFixed(0) + '.') +
      (j && j.contour ? law(Math.round(100 * j.contour.open_frac) + '%', 'of outline stroke ends stop short of other ink: an open joint, never closed by retouching.') : '') +
      law((q('contour', 'tip_sharp') || 0).toFixed(1) + ' vs ' + (q('contour', 'tip_blunt') || 0).toFixed(1), 'half-widths: the lifted end of a stroke tapers about twice as far as the pressed end.') +
      '</div>' : '') +
    '<div class="rules">' + H.RULES.map((r) => {
      const figs = figsFor(r.id);
      return '<article class="rule"><header><b>' + r.jp + '</b><span>' + esc(r.name) + '</span></header><p>' + esc(r.text) + '</p>' +
        '<div class="meta">Vol. ' + r.vol + ' · pages ' + r.pages.map((p) => '<a data-page="' + p + '">' + p + '</a>').join(', ') + '</div>' +
        (figs.length ? '<div class="chips">' + figs.slice(0, 8).map((f) => '<button class="chip" data-fig="' + esc(f.id) + '"><b>' + esc(f.jp || '') + '</b>' + esc(f.title) + '</button>').join('') + '</div>' : '') + '</article>';
    }).join('') + '</div>';
}
$('#rulebook').onclick = (e) => {
  const p = e.target.closest('[data-page]'); if (p) return lightbox(+p.dataset.page);
  const f = e.target.closest('[data-fig]'); if (f) { state.fig = f.dataset.fig; store.set('fig', state.fig); setMode('figure'); }
};
function lightbox(page) {
  $('#lbImg').src = pageSrc(page); $('#lbCap').textContent = 'PDF page ' + page + ' · click to close';
  const d = $('#lightbox'); d.showModal(); d.onclick = () => d.close();
}

// ───────────── export ─────────────
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportPNG() {
  if (!compiled) return;
  const S = 10, c2 = document.createElement('canvas'); c2.width = compiled.size[0] * S; c2.height = compiled.size[1] * S;
  const g2 = c2.getContext('2d'); H.paper(g2, c2.width, c2.height, 11, state.style);
  H.render(g2, compiled.ops, { scale: S, guides: 'none', style: state.style });
  c2.toBlob((b) => download((compiled.id || 'hokusai') + '.png', b));
}
function exportSVG() { if (compiled) download((compiled.id || 'hokusai') + '.svg', new Blob([H.toSVG(compiled, { guides: 'none' })], { type: 'image/svg+xml' })); }

function fmt(v, ind) {
  ind = ind || '';
  const key = (k) => (/^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k));
  const str = (x) => (typeof x === 'string' ? "'" + x.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'" : JSON.stringify(x));
  const flat = (x) => Array.isArray(x) ? '[' + x.map(flat).join(', ') + ']' : x && typeof x === 'object' ? '{ ' + Object.entries(x).map(([k, y]) => key(k) + ': ' + flat(y)).join(', ') + ' }' : str(x);
  const f = flat(v);
  if (f.length + ind.length < 96) return f;
  if (Array.isArray(v)) return '[\n' + v.map((x) => ind + '  ' + fmt(x, ind + '  ')).join(',\n') + ',\n' + ind + ']';
  if (v && typeof v === 'object') return '{\n' + Object.entries(v).filter(([k]) => k !== 'traced').map(([k, x]) => ind + '  ' + key(k) + ': ' + fmt(x, ind + '  ')).join(',\n') + ',\n' + ind + '}';
  return f;
}

// ───────────── modes ─────────────
function setMode(m) {
  state.mode = m;
  document.querySelectorAll('nav [data-mode]').forEach((b) => b.setAttribute('aria-selected', b.dataset.mode === m));
  const rb = m === 'rules';
  $('#rulebook').hidden = !rb; $('#stageCol').hidden = rb; $('#panel').hidden = rb;
  if (m === 'scene' && !state.scene.subject) state.scene.subject = state.fig;
  renderCatalogue();
  if (rb) return renderRulebook();
  recompile(); renderPanel(); show();
}
document.querySelector('nav').onclick = (e) => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); };
setMode(state.mode);
if (Q.has('t')) { setPlaying(false); state.p = +Q.get('t'); draw(); }
})();
</script>
